[project]
name = "mc_rcon_api"
version = "0.1.0"
description = "API to provide safe and restricted RCON access to internal MC servers"
authors = [
    {name = "lopezk38",email = "lopezk38@gmail.com"}
]
license = {text = "GPLv3"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests",
    "fastapi[standard] (>=0.141.1,<0.142.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.scripts]
start = "mc_rcon_api.src.server:start"